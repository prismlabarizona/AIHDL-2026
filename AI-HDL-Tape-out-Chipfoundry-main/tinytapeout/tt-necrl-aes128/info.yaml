yaml_version: 6
project:
  title: NeCRL AES-128 Encryption Peripheral
  author: Team NeCRL (Parsa Mirfasihi, Waylon Woo, Ethan Weldon) - SFSU
  discord: ''
  description: AES-128 hardware encryption peripheral for a TinyQV RISC-V SoC. Composite-field
    S-box, 2-phase pipelined round, one-hot fault-detecting FSM, LFSR DPA countermeasure,
    FIPS-197 power-on self-test, and write-only key registers.
  language: Verilog
  clock_hz: 47600000
  tiles: 4x2
  top_module: tt_um_necrl_aes128
  source_files:
  - tt_wrapper.v
  - tqvp_necrl_aes128.v
  - AES_memory.v
  - AES_control_unit.v
  - AES_key_engine.v
  - AES_encryption_engine.v
  - mix_columns.v
  - sbox_lookup.v
  - test_harness/synchronizer.sv
  - test_harness/spi_reg.sv
  - test_harness/reclocking.sv
  - test_harness/rising_edge_detector.sv
  - test_harness/falling_edge_detector.sv
